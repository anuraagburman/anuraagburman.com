<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafaf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0efe8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D9E75;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a5c42;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <!-- Left accent line -->
  <rect x="80" y="160" width="3" height="120" rx="1.5" fill="#1D9E75"/>

  <!-- Tag line -->
  <text x="80" y="130" font-family="monospace" font-size="14" letter-spacing="3" fill="#1D9E75" font-weight="500">PRODUCT MANAGEMENT PORTFOLIO</text>

  <!-- Name -->
  <text x="100" y="210" font-family="Georgia, serif" font-size="56" fill="#1a1a1a" font-weight="400" letter-spacing="-1">Anuraag Burman</text>

  <!-- Subtitle -->
  <text x="100" y="260" font-family="system-ui, sans-serif" font-size="22" fill="#4a4a4a">Senior Product Manager · Delivery Hero / Foodpanda · Singapore</text>

  <!-- Divider -->
  <rect x="80" y="300" width="200" height="1" fill="#e0ded8"/>

  <!-- Stats row -->
  <g transform="translate(80, 340)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="200" height="80" rx="10" fill="white" stroke="#e0ded8" stroke-width="1"/>
    <text x="20" y="28" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#8a8a8a" text-transform="uppercase">GMV IMPACT</text>
    <text x="20" y="58" font-family="system-ui, sans-serif" font-size="28" fill="#1a1a1a" font-weight="500">$150M+</text>

    <!-- Stat 2 -->
    <rect x="220" y="0" width="200" height="80" rx="10" fill="white" stroke="#e0ded8" stroke-width="1"/>
    <text x="240" y="28" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#8a8a8a">CHURN REDUCTION</text>
    <text x="240" y="58" font-family="system-ui, sans-serif" font-size="28" fill="#1a1a1a" font-weight="500">36%</text>

    <!-- Stat 3 -->
    <rect x="440" y="0" width="200" height="80" rx="10" fill="white" stroke="#e0ded8" stroke-width="1"/>
    <text x="460" y="28" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#8a8a8a">CONVERSION UPLIFT</text>
    <text x="460" y="58" font-family="system-ui, sans-serif" font-size="28" fill="#1a1a1a" font-weight="500">8% → 38%</text>

    <!-- Stat 4 -->
    <rect x="660" y="0" width="200" height="80" rx="10" fill="white" stroke="#e0ded8" stroke-width="1"/>
    <text x="680" y="28" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#8a8a8a">AI PROJECTS SHIPPED</text>
    <text x="680" y="58" font-family="system-ui, sans-serif" font-size="28" fill="#1D9E75" font-weight="500">5</text>
  </g>

  <!-- Domains -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="140" height="32" rx="6" fill="#e8f5ef" stroke="rgba(29,158,117,0.2)" stroke-width="1"/>
    <text x="70" y="21" font-family="monospace" font-size="12" fill="#0a5c42" text-anchor="middle">Subscriptions</text>

    <rect x="156" y="0" width="100" height="32" rx="6" fill="#e8f5ef" stroke="rgba(29,158,117,0.2)" stroke-width="1"/>
    <text x="206" y="21" font-family="monospace" font-size="12" fill="#0a5c42" text-anchor="middle">Fintech</text>

    <rect x="272" y="0" width="130" height="32" rx="6" fill="#eeedfe" stroke="rgba(83,74,183,0.15)" stroke-width="1"/>
    <text x="337" y="21" font-family="monospace" font-size="12" fill="#534AB7" text-anchor="middle">AI Builder</text>

    <rect x="418" y="0" width="110" height="32" rx="6" fill="#fdf0ea" stroke="rgba(216,90,48,0.2)" stroke-width="1"/>
    <text x="473" y="21" font-family="monospace" font-size="12" fill="#D85A30" text-anchor="middle">Growth</text>

    <rect x="544" y="0" width="110" height="32" rx="6" fill="#e6f1fb" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
    <text x="599" y="21" font-family="monospace" font-size="12" fill="#2563EB" text-anchor="middle">Wallets</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="540" width="1200" height="90" fill="white" opacity="0.7"/>
  <rect x="0" y="540" width="1200" height="1" fill="#e0ded8"/>

  <!-- URL -->
  <text x="80" y="590" font-family="monospace" font-size="16" fill="#1D9E75" letter-spacing="0.5">anuraagburman.com</text>

  <!-- Tagline -->
  <text x="1120" y="590" font-family="Georgia, serif" font-size="18" fill="#4a4a4a" text-anchor="end" font-style="italic">I build products that ship. Some of them, I also code.</text>
</svg>
